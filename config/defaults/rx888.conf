# extremely basic default radiod config file for rx888
# copy to /etc/radio/devices, edit as needed

[global]
hardware = rx888
status = rx888.local
data = rx888-data.local
description = rx888
preset = am
ttl = 1

[rx888]
device = rx888
samprate = 129m6
reference = 27m


[channels]
# predefined channels go here in one or more sections

