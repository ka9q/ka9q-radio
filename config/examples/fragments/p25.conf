[P25]
# P25 channels for p25d: complex baseband (I/Q, I on the left), one SSRC per frequency.
# For a trunked system list only the control channel(s): p25d asks radiod for each granted voice
# channel in this channel's form. A Phase 2 (TDMA) voice channel is asked for the same way but at
# 24 kHz with a +/-5 kHz filter (both timeslots share it); nothing needs configuring for that.
# radiod makes those channels from [global], so 'data' must be set there, and [global] 'ttl' is
# theirs (ttl = 0 keeps them on this host). The front end must cover the voice frequencies; p25d
# won't ask for one outside it
# 19.2 kHz is four samples per 4800 baud symbol; with the default 20 ms block that's 384 samples
# per block and a 480-point output transform. The filter passes the whole 12.5 kHz channel
data = p25-iq.local
mode = iq
samprate = 19200
low = -5k
high = +5k
# The [iq] preset turns the linear demodulator's AGC on, and in I/Q mode it scales both I and Q.
# p25d normalizes the level itself, so turn it off and use a fixed gain. Floats can't clip,
# so the gain only needs to be roughly right
encoding = f32le
agc = no
gain = 60
# To halve the network rate use s16be instead, and either keep a 30+ dB margin with the fixed
# gain (as in wspr.conf) or leave the AGC on with a fast recovery (as in hfdl.conf):
#encoding = s16be
#agc = yes
#hang-time = 0
#recovery-rate = 20
# Control channels, or conventional P25 channels: a channel with no trunking is decoded as it is,
# its voice sent on its own SSRC. Several may share this section and its group
freq = "851m0125 851m2625 851m5125"

# A Phase 2 (TDMA) control channel: 24 kHz, four samples per 6000 baud symbol, with the same
# +/-5 kHz filter. p25d runs both receivers on a channel at 24 kHz until one decodes, so a Phase 1
# control channel may be configured this way too. Voice channels granted on it are asked for in
# their own forms: Phase 2 as above, Phase 1 at 19.2 kHz with a +/-5 kHz filter
#[P25 TDMA control]
#data = p25-iq.local
#mode = iq
#samprate = 24000
#low = -5k
#high = +5k
#encoding = f32le
#agc = no
#gain = 60
#freq = "770m50625"

# A conventional channel set apart, e.g. a repeater; p25d decodes its P25 transmissions. p25d
# doesn't demodulate analog FM: on a mixed-mode repeater give the frequency a second, ordinary FM
# section with its own data group as well (radiod gives the second channel on a frequency the
# next SSRC)
#[P25 repeater]
#data = p25-iq.local
#mode = iq
#samprate = 19200
#low = -5k
#high = +5k
#encoding = f32le
#agc = no
#gain = 60
#freq = "146m940"
