# RX888 MkII VHF MARINE — REFERENCE EXAMPLE ONLY
# Adapt this receiver fragment to your own hardware, clock and frequency plan.
# Do not use it as a complete radiod configuration or deploy it without testing.
#
# This is a receiver section fragment. A full radiod config also needs
# [global] and the CH12/CH16/AIS channel sections. Multicast services and
# channel routing are not supplied here.
[rx888]
device = rx888
samprate = 20m
undersample = 1
rand = no
dither = no

# Nominal RX888 MkII 27 MHz reference. Set this to your own measured,
# calibrated reference frequency before relying on precise RF alignment.
reference = 27000000

# 'frequency' is the R828D TUNER LO (Hz), NOT the RF centre.
# RF centre = LO - nominal IF      /      LO = RF centre + nominal IF
# Default 8 MHz profile: nominal IF = 4.570 MHz.
# Marine RF centre = 159.000 MHz, therefore LO = 163.570 MHz.
# Nominal RF window is approx 155-163 MHz, including:
# CH12 156.600 MHz, CH16 156.800 MHz, AIS-A 161.975 MHz,
# AIS-B 162.025 MHz. Verify real filter response and channel
# frequency mapping in radiod before use.
frequency = 163570000

# RF gain = combined R828D LNA + mixer, nominal dB, 29 legal steps:
#   0.0, 0.9, 1.4, 2.7, 3.7, 7.7, 8.7, 12.5, 14.4, 15.7,
#   16.6, 19.7, 20.7, 22.9, 25.4, 28.0, 29.7, 32.8, 33.8,
#   36.4, 37.2, 38.6, 40.2, 42.1, 43.4, 43.9, 44.5, 48.0, 49.6
# Values between supported steps select the nearest nominal value.
# Example manual gain: 37.2 dB; adjust for your RF environment.
vhf-rf-gain = 37.2

# Fixed R828D IF VGA gain, nominal dB, 16 legal steps:
#   -4.7, -2.1, 0.5, 3.5, 7.7, 11.2, 13.6, 14.9,
#   16.3, 19.5, 23.1, 26.5, 30.0, 33.7, 37.2, 40.8
# Nearest legal step is used; R0C[4] VGA_MODE MUST remain zero.
# Corrected initial R0C=EB; 16.3 dB index 8 -> R0C=E8.
vhf-if-gain = 16.3

# R828D hardware RF AGC is NOT validated; fixed manual gains only.
# True is explicitly rejected in this integration branch.
vhf-auto-gain = false

# ANALOGUE IF BANDWIDTH in MHz. Default in VHF mode: 8.0 MHz.
# EXACT supported values and their nominal IF offset are:
#
#  Bandwidth   IF centre    LO for 159.000 MHz RF centre
#   0.290        1.925              160.925
#   0.375        1.857              160.857
#   0.420        2.121              161.121
#   0.470        1.788              160.788
#   0.600        1.706              160.706
#   0.860        1.558              160.558
#   0.950        2.205              161.205
#   1.100        2.125              161.125
#   1.200        1.350              160.350
#   1.300        2.043              161.043
#   1.503        1.276              160.276
#   1.600        1.900              160.900
#   1.753        1.412              160.412
#   1.800        1.400              160.400
#   1.953        1.530              160.530
#   2.200        1.600              160.600
#   3.000        2.000              161.000
#   5.000        3.570              162.570
#   6.000        3.570              162.570
#   7.000        4.570              163.570
#   8.000        4.570              163.570
#
# ADC SAMPLING VS ANALOGUE FILTER:
# The R828D nominal IF is sampled by the RX888 real ADC. In VHF mode,
# the driver advertises usable IF offsets down to about -0.47 * samprate.
# To avoid clipping/aliasing the nominal IF passband, plan for
#   samprate >= (nominal IF + bandwidth / 2) / 0.47
# For example, 1.100 MHz bandwidth / 2.125 MHz nominal IF requires
# about 5.69 MS/s; 6 MS/s is marginal and 8 MS/s gives more headroom.
# The digitised spectrum window stays tied to ADC rate, NOT filter BW.
# See docs/SDR/rx888.md for details and limitations.
#
# CRITICAL: changing this selection does NOT retune 'frequency'.
# Adjust LO manually using the table to retain the same RF centre.
# Narrow profiles cannot receive the entire marine channel span.
vhf-bandwidth-mhz = 8.0
